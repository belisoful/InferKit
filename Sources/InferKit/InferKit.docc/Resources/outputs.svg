<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Result output keys and their typed values, with the convenience accessors on NFKInferenceResult.">
  <rect x="1" y="1" width="758" height="338" rx="16" fill="#F6F8FB" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#1F2933">Result outputs — a key, a typed value, an accessor</text>
  <text x="40" y="66" font-size="12.5" fill="#5A6672">Every output is keyed; the single-natural-type keys also expose a type-checked convenience getter.</text>

  <!-- column headers -->
  <text x="60" y="98" font-size="12" font-weight="700" fill="#64748B">OUTPUT KEY</text>
  <text x="320" y="98" font-size="12" font-weight="700" fill="#64748B">VALUE</text>
  <text x="540" y="98" font-size="12" font-weight="700" fill="#64748B">ACCESSOR</text>
  <line x1="40" y1="106" x2="720" y2="106" stroke="#DCE2EA" stroke-width="1.25"/>

  <!-- rows -->
  <g font-size="12.5">
    <text x="60" y="130" fill="#1F2933">NFKOutputText</text>
    <text x="320" y="130" fill="#5A6672">NSString</text>
    <text x="540" y="130" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.text</text>

    <text x="60" y="156" fill="#1F2933">NFKOutputStructured</text>
    <text x="320" y="156" fill="#5A6672">NSDictionary</text>
    <text x="540" y="156" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.structured</text>

    <text x="60" y="182" fill="#1F2933">NFKOutputEmbedding</text>
    <text x="320" y="182" fill="#5A6672">NSArray&lt;NSNumber&gt;</text>
    <text x="540" y="182" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.embedding</text>

    <text x="60" y="208" fill="#1F2933">NFKOutputDetections</text>
    <text x="320" y="208" fill="#5A6672">[NFKDetection]</text>
    <text x="540" y="208" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.detections</text>

    <text x="60" y="234" fill="#1F2933">NFKOutputPose</text>
    <text x="320" y="234" fill="#5A6672">[NFKKeypoint]</text>
    <text x="540" y="234" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.pose</text>

    <text x="60" y="260" fill="#1F2933">NFKOutputClassifications</text>
    <text x="320" y="260" fill="#5A6672">[NFKClassification]</text>
    <text x="540" y="260" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.classifications</text>

    <text x="60" y="286" fill="#1F2933">NFKOutputSegments</text>
    <text x="320" y="286" fill="#5A6672">[NFKAudioSegment]</text>
    <text x="540" y="286" fill="#1F9D6B" font-family="ui-monospace, Menlo, monospace">result.segments</text>

    <text x="60" y="312" fill="#1F2933">NFKOutputImage · Mask · Audio · Video</text>
    <text x="320" y="312" fill="#5A6672">CVPixelBuffer · texture · asset</text>
    <text x="540" y="312" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace">outputForKey:</text>
  </g>
  <line x1="40" y1="296" x2="720" y2="296" stroke="#EAEFF5" stroke-width="1"/>
</svg>
