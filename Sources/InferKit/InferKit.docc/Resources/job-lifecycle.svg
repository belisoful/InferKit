<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The job lifecycle: submitted becomes running, which resolves to succeeded, failed, or cancelled.">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="16" fill="#F6F8FB" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#1F2933">NFKInferenceJob — an observed, cancellable run</text>

  <!-- states -->
  <rect x="40" y="132" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="105" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">submitted</text>
  <text x="105" y="177" text-anchor="middle" font-size="11" fill="#5A6672">handle returned</text>

  <rect x="250" y="132" width="150" height="56" rx="10" fill="#FFF6EC" stroke="#E8873A" stroke-width="2"/>
  <text x="325" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">running</text>
  <text x="325" y="177" text-anchor="middle" font-size="10.5" fill="#B4791F">progress · partials</text>

  <!-- outcomes (well below the title) -->
  <rect x="500" y="90" width="220" height="44" rx="10" fill="#EBF7F2" stroke="#1F9D6B" stroke-width="2"/>
  <text x="610" y="117" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">succeeded → result</text>

  <rect x="500" y="146" width="220" height="44" rx="10" fill="#FDEEEE" stroke="#D64545" stroke-width="2"/>
  <text x="610" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">failed → error</text>

  <rect x="500" y="202" width="220" height="44" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="2"/>
  <text x="610" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">cancelled</text>

  <!-- transitions -->
  <line x1="172" y1="160" x2="246" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M402 148 L450 148 L450 112 L496 112" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M402 160 L450 160 L450 168 L496 168" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M402 172 L450 172 L450 224 L496 224" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="462" y="214" font-size="11" fill="#64748B">cancel()</text>

  <text x="40" y="277" font-size="12" fill="#5A6672">Prefer it over the blocking call for interactive work — progress, partials, and cancel.</text>
</svg>
