<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Backend taxonomy: one protocol, with shipped zero-dependency backends and consumer-brought engines.">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="318" rx="16" fill="#F6F8FB" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#1F2933">One protocol, many engines</text>

  <!-- protocol -->
  <rect x="270" y="64" width="220" height="52" rx="11" fill="#F3EEFE" stroke="#7A5AF8" stroke-width="2.25"/>
  <text x="380" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">NFKInferenceBackend</text>
  <text x="380" y="106" text-anchor="middle" font-size="11" fill="#5A6672">isReady · runInference… · submitInferenceJob…</text>

  <!-- three groups -->
  <line x1="380" y1="116" x2="380" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="140" x2="610" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="380" y1="140" x2="380" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="610" y1="140" x2="610" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#a5)"/>

  <!-- group 1: shipped core -->
  <rect x="40" y="164" width="220" height="132" rx="11" fill="#EEF3FE" stroke="#2D6CDF" stroke-width="1.5"/>
  <text x="150" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#2D6CDF">Shipped, zero-dependency</text>
  <text x="60" y="210" font-size="11" fill="#1F2933">• NFKPassthroughBackend</text>
  <text x="60" y="230" font-size="11" fill="#1F2933">• NFKCoreMLBackend · …Language</text>
  <text x="60" y="250" font-size="11" fill="#1F2933">• NFKRemote… · NFKAnthropicBackend</text>
  <text x="60" y="270" font-size="11" fill="#1F2933">• NFKAsyncGenerationBackend</text>
  <text x="72" y="286" font-size="10" fill="#5A6672">a submit → poll → fetch base</text>

  <!-- group 2: companion -->
  <rect x="270" y="164" width="220" height="132" rx="11" fill="#F3EEFE" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="380" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#7A5AF8">Companion (link to enable)</text>
  <text x="290" y="212" font-size="11.5" fill="#1F2933">• InferKitMLX — 60+ models</text>
  <text x="304" y="230" font-size="10.5" fill="#5A6672">image · video · audio · LLM · diffusion</text>
  <text x="290" y="252" font-size="11.5" fill="#1F2933">• NFKMLXBackend — Stable Diffusion</text>
  <text x="290" y="274" font-size="11.5" fill="#1F2933">• InferKitFoundationModels — LLM</text>

  <!-- group 3: consumer -->
  <rect x="500" y="164" width="220" height="132" rx="11" fill="#EBF7F2" stroke="#1F9D6B" stroke-width="1.5"/>
  <text x="610" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#1F9D6B">Brought by you</text>
  <text x="520" y="212" font-size="11.5" fill="#1F2933">• Adopt the protocol directly, or</text>
  <text x="520" y="234" font-size="11.5" fill="#1F2933">• NFKDynamicBackendProvider</text>
  <text x="534" y="252" font-size="10.5" fill="#5A6672">discovered by name at runtime</text>
  <text x="520" y="276" font-size="10.5" fill="#5A6672">whisper.cpp · ControlNet · a runtime</text>
</svg>
