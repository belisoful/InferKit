# CI mirrors the Full Check in CLAUDE.md, scoped to what a hosted runner can do.
#
# What runs here: the core's build + 177 tests with a zero-warning gate, the iOS and tvOS compile
# legs, the static analyzer at a fresh derived-data path, the podspec lint, compile checks for
# the companion packages, and a type check of every Objective-C block in the consumer documents.
#
# What deliberately does NOT run here: the MLX test schemes (563/35/22). They evaluate real MLX
# arrays, which needs the Metal toolchain's default.metallib and a GPU the runner may not expose,
# and the parity suites read multi-gigabyte checkpoints from ~/.inferkit-validation that only exist
# on the validation machine — on a runner they would skip, proving nothing. The three-scheme run
# stays the documented local pre-release step.
#
# The runner image decides which Xcode is active, and the two current ones behave differently for
# MLX. Through Xcode 26, SwiftPM leaves mlx-swift's .metal sources alone and a compile needs no Metal
# compiler. From Xcode 27, SwiftPM compiles them during `swift build` and Xcode ships that compiler as
# a separate component, so the MLX job installs it when it is missing. Both paths are supported, so
# the workflow runs on an image that has not moved to Xcode 27 yet.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core (build, test, iOS, tvOS, analyzer, podspec)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (zero warnings)
        run: |
          swift build 2>&1 | tee build.log
          ! grep -E "warning:" build.log

      - name: Test
        run: swift test

      - name: iOS compile
        run: xcodebuild build -scheme InferKit -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-ios"

      # A tvOS DESTINATION does not resolve on a machine without tvOS platform support, but a
      # compile only needs the SDK — so the SDK is named directly, discovered rather than pinned,
      # and the invocation goes through the workspace because a bare package rejects -sdk.
      - name: tvOS compile
        run: |
          TVOS_SDK=$(xcodebuild -showsdks | awk '/appletvos/ {print $NF}' | tail -1)
          echo "using $TVOS_SDK"
          xcodebuild build -workspace InferKit.xcworkspace -scheme InferKit -sdk "$TVOS_SDK" -arch arm64 -derivedDataPath "$RUNNER_TEMP/dd-tvos"

      # The analyzer is cached; a fresh derived-data path is what makes it actually report.
      - name: Analyze (zero issues)
        run: |
          xcodebuild analyze -scheme InferKit -derivedDataPath "$RUNNER_TEMP/dd-analyze" 2>&1 | tee analyze.log
          ! grep -E ": warning:" analyze.log

      - name: Podspec lint
        run: pod lib lint InferKit.podspec --quick

  mlx:
    name: InferKitMLX (compile) and documented Objective-C snippets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # From Xcode 27 the Metal compiler is an on-demand component, and SwiftPM compiles mlx-swift's
      # kernels during `swift build`, so a missing component fails the build at the first shader.
      # Through Xcode 26 the compiler either ships with Xcode or is never invoked here, so the
      # download is attempted only when `metal` does not run, and a toolchain whose xcodebuild has no
      # -downloadComponent is reported rather than treated as a failure.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          if xcrun metal --version >/dev/null 2>&1; then
            echo "metal runs; no component to install"
            exit 0
          fi
          echo "metal is unavailable; attempting the on-demand component"
          if xcodebuild -downloadComponent MetalToolchain; then
            xcrun metal --version
          else
            echo "this Xcode does not offer -downloadComponent MetalToolchain; continuing"
          fi

      - name: Build (macOS)
        run: swift build --package-path InferKitMLX
      - name: Build (iOS)
        run: xcodebuild build -scheme InferKitMLX -destination 'generic/platform=iOS' -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd-mlx-ios"
        working-directory: InferKitMLX

      # Every Objective-C block in README.md, Docs/examples.md, and Docs/inference-guide.md compiles
      # against the core's headers and the header each companion's build generates. The job has
      # already built InferKitMLX; the checker builds the other two companions, whose floor is the
      # macOS 26 SDK, so a runner on an older image reports the check as skipped.
      - name: Documented Objective-C snippets
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          if [ "$SDK" -lt 26 ]; then
            echo "macOS SDK $SDK < 26 — the snippet check needs every companion's header; skipped."
            exit 0
          fi
          python3 Tools/doc-snippets/check-objc.py

  apple-swift:
    name: InferKitAppleSwift (build + test, when the SDK allows)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # SpeechAnalyzer, the document reader, and Translation are macOS 26 APIs, so the package needs
      # that SDK. A runner on an older image reports what it skipped rather than failing.
      - name: Build and test, or state why not
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          if [ "$SDK" -lt 26 ]; then
            echo "macOS SDK $SDK < 26 — InferKitAppleSwift needs the macOS 26 SDK; skipped."
            exit 0
          fi
          swift build --package-path InferKitAppleSwift
          swift test --package-path InferKitAppleSwift

  foundation-models:
    name: InferKitFoundationModels (build + test, when the SDK allows)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The package's floor is the macOS 26 SDK; a runner still on an older image cannot compile it
      # at all, so the job reports what it skipped rather than failing on toolchain availability.
      - name: Build and test, or state why not
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          if [ "$SDK" -lt 26 ]; then
            echo "macOS SDK $SDK < 26 — InferKitFoundationModels needs the macOS 26 SDK; skipped."
            exit 0
          fi
          swift build --package-path InferKitFoundationModels
          swift test --package-path InferKitFoundationModels
