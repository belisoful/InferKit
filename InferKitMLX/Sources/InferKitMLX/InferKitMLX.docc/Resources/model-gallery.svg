<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The InferKitMLX model gallery grouped into six families: image-to-image, image analysis, video, audio, generation, and language.">
  <rect x="1" y="1" width="998" height="328" rx="16" fill="#F6F8FB" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#1F2933">The InferKitMLX model gallery</text>

  <!-- Column 1: Image -> image -->
  <rect x="24" y="60" width="148" height="30" rx="15" fill="#EAF1FD" stroke="#2D6CDF" stroke-width="1.75"/>
  <text x="98" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">Image → image</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="36" cy="114" r="3" fill="#2D6CDF"/><text x="46" y="118">super-resolution</text>
    <circle cx="36" cy="140" r="3" fill="#2D6CDF"/><text x="46" y="144">restoration</text>
    <circle cx="36" cy="166" r="3" fill="#2D6CDF"/><text x="46" y="170">low-light</text>
    <circle cx="36" cy="192" r="3" fill="#2D6CDF"/><text x="46" y="196">style transfer</text>
    <circle cx="36" cy="218" r="3" fill="#2D6CDF"/><text x="46" y="222">colorization</text>
    <circle cx="36" cy="244" r="3" fill="#2D6CDF"/><text x="46" y="248">inpainting</text>
    <circle cx="36" cy="270" r="3" fill="#2D6CDF"/><text x="46" y="274">face restoration</text>
  </g>

  <!-- Column 2: Image -> analysis -->
  <rect x="188" y="60" width="148" height="30" rx="15" fill="#F3EEFE" stroke="#7A5AF8" stroke-width="1.75"/>
  <text x="262" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7A5AF8">Image → analysis</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="200" cy="114" r="3" fill="#7A5AF8"/><text x="210" y="118">depth</text>
    <circle cx="200" cy="140" r="3" fill="#7A5AF8"/><text x="210" y="144">segmentation</text>
    <circle cx="200" cy="166" r="3" fill="#7A5AF8"/><text x="210" y="170">matting</text>
    <circle cx="200" cy="192" r="3" fill="#7A5AF8"/><text x="210" y="196">detection · faces</text>
    <circle cx="200" cy="218" r="3" fill="#7A5AF8"/><text x="210" y="222">pose</text>
    <circle cx="200" cy="244" r="3" fill="#7A5AF8"/><text x="210" y="248">embeddings</text>
    <circle cx="200" cy="270" r="3" fill="#7A5AF8"/><text x="210" y="274">vision-language</text>
  </g>

  <!-- Column 3: Video -->
  <rect x="352" y="60" width="148" height="30" rx="15" fill="#E6F6F6" stroke="#0EA5A5" stroke-width="1.75"/>
  <text x="426" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E8C8C">Video</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="364" cy="114" r="3" fill="#0EA5A5"/><text x="374" y="118">frame interpolation</text>
    <circle cx="364" cy="140" r="3" fill="#0EA5A5"/><text x="374" y="144">optical flow</text>
    <circle cx="364" cy="166" r="3" fill="#0EA5A5"/><text x="374" y="170">super-resolution</text>
    <circle cx="364" cy="192" r="3" fill="#0EA5A5"/><text x="374" y="196">video matting</text>
    <circle cx="364" cy="218" r="3" fill="#0EA5A5"/><text x="374" y="222">clip in, clip out</text>
  </g>

  <!-- Column 4: Audio -->
  <rect x="516" y="60" width="148" height="30" rx="15" fill="#FFF3E8" stroke="#E8873A" stroke-width="1.75"/>
  <text x="590" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C56E24">Audio</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="528" cy="114" r="3" fill="#E8873A"/><text x="538" y="118">source separation</text>
    <circle cx="528" cy="140" r="3" fill="#E8873A"/><text x="538" y="144">transcription</text>
    <circle cx="528" cy="166" r="3" fill="#E8873A"/><text x="538" y="170">voice activity</text>
    <circle cx="528" cy="192" r="3" fill="#E8873A"/><text x="538" y="196">tagging</text>
    <circle cx="528" cy="218" r="3" fill="#E8873A"/><text x="538" y="222">neural codecs</text>
    <circle cx="528" cy="244" r="3" fill="#E8873A"/><text x="538" y="248">text-to-speech</text>
    <circle cx="528" cy="270" r="3" fill="#E8873A"/><text x="538" y="274">text-to-music</text>
  </g>

  <!-- Column 5: Generation -->
  <rect x="680" y="60" width="148" height="30" rx="15" fill="#FDECF1" stroke="#D63A6A" stroke-width="1.75"/>
  <text x="754" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B32C57">Generation</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="692" cy="114" r="3" fill="#D63A6A"/><text x="702" y="118">Stable Diffusion</text>
    <circle cx="692" cy="140" r="3" fill="#D63A6A"/><text x="702" y="144">Z-Image · SANA</text>
    <circle cx="692" cy="166" r="3" fill="#D63A6A"/><text x="702" y="170">LTX-Video · Wan</text>
    <circle cx="692" cy="192" r="3" fill="#D63A6A"/><text x="702" y="196">image-conditioned</text>
    <circle cx="692" cy="218" r="3" fill="#D63A6A"/><text x="702" y="222">flow · DDIM · DPM · UniPC</text>
  </g>

  <!-- Column 6: Language -->
  <rect x="844" y="60" width="132" height="30" rx="15" fill="#EBF7F2" stroke="#1F9D6B" stroke-width="1.75"/>
  <text x="910" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A7F57">Language</text>
  <g font-size="11.5" fill="#3A4652">
    <circle cx="856" cy="114" r="3" fill="#1F9D6B"/><text x="866" y="118">Qwen3 · Qwen3.5</text>
    <circle cx="856" cy="140" r="3" fill="#1F9D6B"/><text x="866" y="144">Gemma 4 · Gemma 2</text>
    <circle cx="856" cy="166" r="3" fill="#1F9D6B"/><text x="866" y="170">DeepSeek V4 · MoE</text>
    <circle cx="856" cy="192" r="3" fill="#1F9D6B"/><text x="866" y="196">GGUF · quantized</text>
    <circle cx="856" cy="218" r="3" fill="#1F9D6B"/><text x="866" y="222">embeddings · rerank</text>
    <circle cx="856" cy="244" r="3" fill="#1F9D6B"/><text x="866" y="248">T5 · chat templates</text>
  </g>

  <text x="32" y="316" font-size="11" fill="#64748B">Sixty-plus real models, each at measured reference parity, each behind the same NFKInferenceBackend contract.</text>
</svg>
