<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The diffusion loop: encode once, then denoise and scheduler-step per timestep, then decode once to an image.">
  <defs>
    <marker id="dla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="16" fill="#F6F8FB" stroke="#DCE2EA" stroke-width="1.5"/>
  <text x="36" y="42" font-size="18" font-weight="700" fill="#1F2933">The diffusion loop — you own the model, the scheduler is a seam</text>

  <!-- encode -->
  <rect x="36" y="122" width="120" height="60" rx="11" fill="#F3EEFE" stroke="#7A5AF8" stroke-width="2"/>
  <text x="96" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">encode</text>
  <text x="96" y="168" text-anchor="middle" font-size="10.5" fill="#5A6672">→ context</text>

  <!-- denoise -->
  <rect x="236" y="122" width="132" height="60" rx="11" fill="#EAF1FD" stroke="#2D6CDF" stroke-width="2"/>
  <text x="302" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">denoise</text>
  <text x="302" y="168" text-anchor="middle" font-size="10.5" fill="#5A6672">your UNet forward</text>

  <!-- scheduler step -->
  <rect x="408" y="122" width="150" height="60" rx="11" fill="#EBF7F2" stroke="#1F9D6B" stroke-width="2"/>
  <text x="483" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">scheduler step</text>
  <text x="483" y="168" text-anchor="middle" font-size="10.5" fill="#5A6672">DDIM · LCM</text>

  <!-- decode -->
  <rect x="610" y="122" width="120" height="60" rx="11" fill="#FFF3E8" stroke="#E8873A" stroke-width="2"/>
  <text x="670" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2933">decode</text>
  <text x="670" y="168" text-anchor="middle" font-size="10.5" fill="#5A6672">→ image</text>

  <!-- forward arrows -->
  <line x1="156" y1="152" x2="234" y2="152" stroke="#94A3B8" stroke-width="2" marker-end="url(#dla)"/>
  <text x="195" y="144" text-anchor="middle" font-size="10" fill="#64748B">latent</text>
  <line x1="368" y1="152" x2="406" y2="152" stroke="#94A3B8" stroke-width="2" marker-end="url(#dla)"/>
  <line x1="558" y1="152" x2="608" y2="152" stroke="#94A3B8" stroke-width="2" marker-end="url(#dla)"/>
  <text x="583" y="144" text-anchor="middle" font-size="10" fill="#64748B">done</text>

  <!-- loop back: step top -> up -> across -> denoise top -->
  <path d="M483 122 L483 96 L302 96 L302 120" fill="none" stroke="#7A5AF8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dla)"/>
  <text x="392" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#7A5AF8">repeat ×T timesteps</text>

  <text x="36" y="222" font-size="11.5" fill="#5A6672">No source latent → text-to-image · a source latent → image-to-image · source latent + mask → inpainting.</text>
  <text x="36" y="244" font-size="11.5" fill="#5A6672">The backend owns the loop, per-step progress and cancellation, and the CGImage ↔ MLXArray bridge.</text>
</svg>
